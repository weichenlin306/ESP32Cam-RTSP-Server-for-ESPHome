# Button Entities (Supports camera software reset & ESP32 system reboot)
button:
  - platform: template
    name: "Restart Camera"
    id: restart_cam_button
    icon: "mdi:camera-retake"
    on_press:
      - lambda: |-
          ESP_LOGI("camera_control", "Restarting camera driver and sensor via button...");
          id(rtsp_camera).reset_sensor();
          // Re-apply current switch and slider settings
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_hmirror(s, id(cam_hmirror).state ? 1 : 0);
            s->set_vflip(s, id(cam_vflip).state ? 1 : 0);
            s->set_brightness(s, (int)id(cam_brightness).state);
            s->set_contrast(s, (int)id(cam_contrast).state);
            s->set_saturation(s, (int)id(cam_saturation).state);
            s->set_ae_level(s, (int)id(cam_ae_level).state);
            s->set_aec_value(s, (int)id(cam_aec_value).state);
            s->set_agc_gain(s, (int)id(cam_agc_gain).state);
            s->set_whitebal(s, id(cam_whitebal).state ? 1 : 0);
            s->set_awb_gain(s, id(cam_awb_gain).state ? 1 : 0);
            s->set_exposure_ctrl(s, id(cam_exposure_ctrl).state ? 1 : 0);
            s->set_aec2(s, id(cam_aec2).state ? 1 : 0);
            s->set_gain_ctrl(s, id(cam_gain_ctrl).state ? 1 : 0);
            s->set_bpc(s, id(cam_bpc).state ? 1 : 0);
            s->set_wpc(s, id(cam_wpc).state ? 1 : 0);
            s->set_raw_gma(s, id(cam_raw_gma).state ? 1 : 0);
            s->set_lenc(s, id(cam_lenc).state ? 1 : 0);
            s->set_dcw(s, id(cam_dcw).state ? 1 : 0);
            s->set_colorbar(s, id(cam_colorbar).state ? 1 : 0);
          }
          ESP_LOGI("camera_control", "Camera restart completed.");

  - platform: template
    name: "Cold Restart Camera"
    id: cold_restart_cam_button
    icon: "mdi:power-cycle"
    on_press:
      - lambda: |-
          ESP_LOGI("camera_control", "Executing camera hardware cold restart (power down for 2 seconds before power on)...");
          // Supports custom power down discharge duration (milliseconds), e.g. 2000 for 2 seconds
          id(rtsp_camera).cold_restart(2000);
          // Re-apply current control panel switch and slider settings
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_hmirror(s, id(cam_hmirror).state ? 1 : 0);
            s->set_vflip(s, id(cam_vflip).state ? 1 : 0);
            s->set_brightness(s, (int)id(cam_brightness).state);
            s->set_contrast(s, (int)id(cam_contrast).state);
            s->set_saturation(s, (int)id(cam_saturation).state);
            s->set_ae_level(s, (int)id(cam_ae_level).state);
            s->set_aec_value(s, (int)id(cam_aec_value).state);
            s->set_agc_gain(s, (int)id(cam_agc_gain).state);
            s->set_whitebal(s, id(cam_whitebal).state ? 1 : 0);
            s->set_awb_gain(s, id(cam_awb_gain).state ? 1 : 0);
            s->set_exposure_ctrl(s, id(cam_exposure_ctrl).state ? 1 : 0);
            s->set_aec2(s, id(cam_aec2).state ? 1 : 0);
            s->set_gain_ctrl(s, id(cam_gain_ctrl).state ? 1 : 0);
            s->set_bpc(s, id(cam_bpc).state ? 1 : 0);
            s->set_wpc(s, id(cam_wpc).state ? 1 : 0);
            s->set_raw_gma(s, id(cam_raw_gma).state ? 1 : 0);
            s->set_lenc(s, id(cam_lenc).state ? 1 : 0);
            s->set_dcw(s, id(cam_dcw).state ? 1 : 0);
            s->set_colorbar(s, id(cam_colorbar).state ? 1 : 0);
          }
          ESP_LOGI("camera_control", "Camera hardware cold restart completed.");

  - platform: template
    name: "Reset to Factory Defaults"
    id: reset_factory_defaults_button
    icon: "mdi:restore"
    on_press:
      - lambda: |-
          ESP_LOGI("camera_control", "Restoring all camera settings to factory defaults (based on YAML and component configuration)...");
          id(rtsp_camera).restore_factory_defaults();
          // Dynamically read compiled factory default values and publish to control panel
          auto &fd = id(rtsp_camera).get_factory_defaults();
          id(cam_brightness).publish_state(fd.brightness);
          id(cam_contrast).publish_state(fd.contrast);
          id(cam_saturation).publish_state(fd.saturation);
          id(cam_ae_level).publish_state(fd.ae_level);
          id(cam_aec_value).publish_state(fd.aec_value);
          id(cam_agc_gain).publish_state(fd.agc_gain);

          const char* fx_names[] = {"None", "Negative", "Grayscale", "Red Tint", "Green Tint", "Blue Tint", "Sepia"};
          if (fd.special_effect >= 0 && fd.special_effect <= 6) {
            id(cam_special_effect).publish_state(fx_names[fd.special_effect]);
          }

          const char* wb_names[] = {"Auto", "Sunny", "Cloudy", "Office", "Home"};
          if (fd.wb_mode >= 0 && fd.wb_mode <= 4) {
            id(cam_wb_mode).publish_state(wb_names[fd.wb_mode]);
          }

          const char* gc_names[] = {"2X", "4X", "8X", "16X", "32X", "64X", "128X"};
          if (fd.gainceiling >= 0 && fd.gainceiling <= 6) {
            id(cam_gainceiling).publish_state(gc_names[fd.gainceiling]);
          }

          id(cam_hmirror).publish_state(fd.hmirror != 0);
          id(cam_vflip).publish_state(fd.vflip != 0);
          id(cam_whitebal).publish_state(fd.whitebal != 0);
          id(cam_awb_gain).publish_state(fd.awb_gain != 0);
          id(cam_exposure_ctrl).publish_state(fd.exposure_ctrl != 0);
          id(cam_aec2).publish_state(fd.aec2 != 0);
          id(cam_gain_ctrl).publish_state(fd.gain_ctrl != 0);
          id(cam_bpc).publish_state(fd.bpc != 0);
          id(cam_wpc).publish_state(fd.wpc != 0);
          id(cam_raw_gma).publish_state(fd.raw_gma != 0);
          id(cam_lenc).publish_state(fd.lenc != 0);
          id(cam_dcw).publish_state(fd.dcw != 0);
          id(cam_colorbar).publish_state(false);
          id(cam_resolution).publish_state(id(rtsp_camera).get_resolution_name(fd.framesize));
          ESP_LOGI("camera_control", "Factory default settings successfully restored.");

  - platform: restart
    name: "Restart Device"
    id: restart_device_button
    icon: "mdi:restart"
