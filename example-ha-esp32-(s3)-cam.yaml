# Number Entities (Sliders)
number:
  - platform: template
    name: "Brightness"
    id: cam_brightness
    icon: "mdi:brightness-6"
    optimistic: true
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_brightness(s, (int)x);
          }

  - platform: template
    name: "Contrast"
