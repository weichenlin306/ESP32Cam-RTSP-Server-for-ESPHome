# 下拉選單 (Select 實體)
select:
  - platform: template
    name: "相機解析度 (Resolution)"
    id: cam_resolution
    icon: "mdi:aspect-ratio"
    optimistic: true
    initial_option: "VGA (640x480)"
    options:
      - "QQVGA (160x120)"
      - "QCIF (176x144)"
      - "HQVGA (240x176)"
      - "240X240"
      - "QVGA (320x240)"
      - "CIF (400x296)"
      - "HVGA (480x320)"
      - "VGA (640x480)"
      - "SVGA (800x600)"
      - "XGA (1024x768)"
      - "HD (1280x720)"
      - "SXGA (1280x1024)"
      - "UXGA (1600x1200)"
    set_action:
      - lambda: |-
          framesize_t fs = FRAMESIZE_VGA;
          if (x == "QQVGA (160x120)") fs = FRAMESIZE_QQVGA;
          else if (x == "QCIF (176x144)") fs = FRAMESIZE_QCIF;
          else if (x == "HQVGA (240x176)") fs = FRAMESIZE_HQVGA;
          else if (x == "240X240") fs = FRAMESIZE_240X240;
          else if (x == "QVGA (320x240)") fs = FRAMESIZE_QVGA;
          else if (x == "CIF (400x296)") fs = FRAMESIZE_CIF;
          else if (x == "HVGA (480x320)") fs = FRAMESIZE_HVGA;
          else if (x == "VGA (640x480)") fs = FRAMESIZE_VGA;
          else if (x == "SVGA (800x600)") fs = FRAMESIZE_SVGA;
          else if (x == "XGA (1024x768)") fs = FRAMESIZE_XGA;
          else if (x == "HD (1280x720)") fs = FRAMESIZE_HD;
          else if (x == "SXGA (1280x1024)") fs = FRAMESIZE_SXGA;
          else if (x == "UXGA (1600x1200)") fs = FRAMESIZE_UXGA;
          id(rtsp_camera).set_dynamic_resolution(fs);

  - platform: template
    name: "特殊效果 (Special Effect)"
    id: cam_special_effect
    icon: "mdi:image-filter-vintage"
    optimistic: true
    initial_option: "無 (None)"
    options:
      - "無 (None)"
      - "負片 (Negative)"
      - "灰階 (Grayscale)"
      - "紅調 (Red Tint)"
      - "綠調 (Green Tint)"
      - "藍調 (Blue Tint)"
      - "復古 (Sepia)"
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            int effect = 0;
            if (x == "負片 (Negative)") effect = 1;
            else if (x == "灰階 (Grayscale)") effect = 2;
            else if (x == "紅調 (Red Tint)") effect = 3;
            else if (x == "綠調 (Green Tint)") effect = 4;
            else if (x == "藍調 (Blue Tint)") effect = 5;
            else if (x == "復古 (Sepia)") effect = 6;
            s->set_special_effect(s, effect);
          }

  - platform: template
    name: "白平衡模式 (White Balance Mode)"
    id: cam_wb_mode
    icon: "mdi:white-balance-sunny"
    optimistic: true
    initial_option: "自動 (Auto)"
    options:
      - "自動 (Auto)"
      - "晴天 (Sunny)"
      - "陰天 (Cloudy)"
      - "辦公室 (Office)"
      - "居家 (Home)"
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            int mode = 0;
            if (x == "晴天 (Sunny)") mode = 1;
            else if (x == "陰天 (Cloudy)") mode = 2;
            else if (x == "辦公室 (Office)") mode = 3;
            else if (x == "居家 (Home)") mode = 4;
            s->set_wb_mode(s, mode);
          }

  - platform: template
    name: "增益上限 (Gain Ceiling)"
    id: cam_gainceiling
    icon: "mdi:arrow-collapse-up"
    optimistic: true
    initial_option: "2X"
    options:
      - "2X"
      - "4X"
      - "8X"
      - "16X"
      - "32X"
      - "64X"
      - "128X"
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            gainceiling_t gc = GAINCEILING_2X;
            if (x == "4X") gc = GAINCEILING_4X;
            else if (x == "8X") gc = GAINCEILING_8X;
            else if (x == "16X") gc = GAINCEILING_16X;
            else if (x == "32X") gc = GAINCEILING_32X;
            else if (x == "64X") gc = GAINCEILING_64X;
            else if (x == "128X") gc = GAINCEILING_128X;
            s->set_gainceiling(s, gc);
          }

